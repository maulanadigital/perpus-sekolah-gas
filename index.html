 background-size:cover;background-position:center;background-attachment:fixed}
.login-card{width:min(430px,100%);background:#fff;border-radius:22px;box-shadow:0 18px 50px rgba(18,53,93,.16);padding:36px}
.school-logo{width:74px;height:74px;border-radius:50%;background:#eef5ff;border:3px solid #d6e7ff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--navy);font-size:30px;font-weight:800}
.login-card h1{text-align:center;color:var(--navy);font-size:23px;margin:8px 0 2px}
.login-card .sub{text-align:center;color:var(--blue);font-weight:700;margin-bottom:5px}
.login-card .desc{text-align:center;color:var(--muted);font-size:13px;margin-bottom:28px}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#3b4658}
.field input{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px 13px;outline:none}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,100,199,.1)}
.primary{width:100%;border:0;border-radius:10px;padding:13px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:800}
.login-help{margin-top:18px;padding:11px;background:#f5f8fc;border-radius:10px;color:var(--muted);font-size:12px;line-height:1.6;text-align:center}
.app{min-height:100vh;display:flex}
.sidebar{width:245px;background:linear-gradient(180deg,#06285a,#073a7e);color:#fff;position:fixed;left:0;top:0;bottom:0;padding:18px 14px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:8px 8px 22px;border-bottom:1px solid rgba(255,255,255,.13);margin-bottom:14px}
.brand-mark{width:43px;height:43px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900}
.brand strong{font-size:13px;line-height:1.2}.brand span{font-size:10px;opacity:.75}
.nav-title{font-size:10px;text-transform:uppercase;opacity:.55;margin:15px 9px 7px}
.nav-btn{width:100%;border:0;background:transparent;color:#eaf2ff;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0;font-weight:650}
.nav-btn:hover,.nav-btn.active{background:rgba(255,255,255,.14);color:#fff}.nav-btn{cursor:pointer}
.main{margin-left:245px;width:calc(100% - 245px)}
.topbar{height:68px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:flex-end;padding:0 28px;gap:18px;position:sticky;top:0;z-index:10}
.profile{display:flex;align-items:center;gap:10px}.avatar{width:37px;height:37px;border-radius:50%;background:#e9f2ff;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800}
.profile small{display:block;color:var(--muted);font-size:11px}
.content{padding:28px;max-width:1500px;margin:auto}
.crumb{font-size:12px;color:var(--muted);margin-bottom:8px}
.page-title{font-size:25px;margin:0 0 5px;color:#15233b}
.page-sub{color:var(--muted);font-size:13px;margin:0 0 22px}
.searchbar{display:flex;gap:10px;margin-bottom:24px}.searchbar input{flex:1;border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#fff}.searchbar button{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:0 22px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.stat-icon{width:43px;height:43px;border-radius:12px;background:#eaf3ff;color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:20px}
.stat b{display:block;font-size:24px}.stat span{font-size:11px;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 13px}.section-head h2{font-size:17px;margin:0}.link-btn{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:700}
.book-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.book-card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:8px;box-shadow:var(--shadow);transition:.2s;min-width:0}
.book-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(22,45,80,.12)}
.cover{height:145px;border-radius:7px;background:linear-gradient(145deg,#e7f1ff,#d9e6f8);display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:900;text-align:center;padding:6px;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:contain;display:block;border-radius:6px;background:#f7f9fc}
.book-cover-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;font-size:11px}
.detail .cover img{object-fit:contain;background:#f7f9fc}
.book-card h3{font-size:11px;line-height:1.25;margin:7px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.book-card p{font-size:10px;line-height:1.25;color:var(--muted);margin:0 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:9px;font-weight:800}.available{background:#e8f8ef;color:#16814e}.soon{background:#fff3df;color:#b86b00}.late{background:#fdebed;color:#b83a45}
.card-actions{display:flex;gap:5px;margin-top:6px}.outline{flex:1;border:1px solid #cbd8ea;background:#fff;color:var(--blue);padding:5px;border-radius:7px;font-size:9px;font-weight:700}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0f5}th{color:#66758c;font-size:10px;text-transform:uppercase}td{color:#344158}
.detail{display:grid;grid-template-columns:280px 1fr;gap:28px}.detail .cover{height:380px}
.detail-info h2{font-size:27px;margin:0 0 18px}.meta{display:grid;grid-template-columns:150px 1fr;gap:10px;font-size:13px}.meta span:first-child{color:var(--muted)}
.action{margin-top:24px;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px 24px;font-weight:800}
.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.activity li{list-style:none;padding:10px 0;border-bottom:1px solid #edf0f5;font-size:12px}.activity{padding:0;margin:0}
.toolbar{display:flex;gap:10px;margin-bottom:16px}.toolbar input,.toolbar select{border:1px solid var(--border);padding:10px;border-radius:9px;background:#fff}.toolbar input{flex:1}.add{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 15px;font-weight:700}
.toast{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);z-index:50;font-size:13px}
.modal-wrap{position:fixed;inset:0;background:rgba(7,24,50,.48);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal{width:min(520px,100%);background:#fff;border-radius:16px;padding:24px}.modal h2{margin-top:0}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.secondary{border:1px solid var(--border);background:#fff;padding:10px 16px;border-radius:9px}
@media(max-width:1400px){.book-grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(max-width:1100px){.book-grid{grid-template-columns:repeat(5,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.form-grid{grid-template-columns:1fr}.return-card{grid-template-columns:1fr}.sidebar{width:72px}.brand div,.nav-title,.nav-btn span{display:none}.brand{justify-content:center}.nav-btn{text-align:center}.main{margin-left:72px;width:calc(100% - 72px)}.content{padding:18px}.book-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.detail{grid-template-columns:1fr}.admin-grid{grid-template-columns:1fr}.topbar{padding:0 15px}}
@media(max-width:520px){.book-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cover{height:135px}}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-grid .full{grid-column:1/-1}
.form-grid input,.form-grid select,.form-grid textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 11px;outline:none;background:#fff}
.form-grid textarea{min-height:90px;resize:vertical}
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,100,199,.08)}
.modal.large{width:min(760px,100%);max-height:90vh;overflow:auto}
.category-note{font-size:11px;color:var(--muted);margin-top:5px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}


.member-actions{display:flex;gap:6px;flex-wrap:wrap}
.mini-btn{border:0;border-radius:7px;padding:6px 9px;font-size:10px;font-weight:800}
.mini-green{background:#e8f8ef;color:#16814e}.mini-orange{background:#fff3df;color:#b86b00}
.mini-red{background:#fdebed;color:#b83a45}.mini-blue{background:#eaf3ff;color:#1264c7}
.report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-bottom:18px}
.report-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.progress{height:10px;background:#edf1f6;border-radius:99px;overflow:hidden;margin:7px 0 14px}
.progress span{display:block;height:100%;background:var(--blue);border-radius:99px}
.report-tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.report-tools button{border-radius:9px;padding:10px 13px;font-weight:800;font-size:12px}.table-actions{display:flex;gap:5px;white-space:nowrap}.mini{border:1px solid var(--border);border-radius:7px;background:#fff;padding:6px 8px;font-size:10px;font-weight:800}.mini.edit{color:var(--blue)}.mini.delete{color:var(--red)}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px}.form-grid .field{margin-bottom:10px}.form-info{padding:10px 12px;background:#f5f8fc;border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:12px;line-height:1.6}.form-info .badge{margin-left:7px}.return-card{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px;background:#f7faff;border:1px solid var(--border);border-radius:10px;font-size:13px}.return-card .action{grid-column:1/-1;justify-self:start}.report-note{background:#f7f9fc;border:1px solid var(--border);border-radius:9px;padding:11px 13px;color:var(--muted);font-size:12px;line-height:1.6}.annual-preview{margin-top:12px}.annual-summary{background:#f6f9fd;border:1px solid var(--border);border-radius:9px;padding:10px 12px;font-size:12px;line-height:1.7}.annual-summary .ok{color:var(--green)}.annual-summary .danger{color:var(--red)}.action-select{border:1px solid var(--border);border-radius:8px;padding:7px 9px;background:#fff;font-size:11px;font-weight:700}

.login-error{margin:0 0 16px;padding:11px 13px;border-radius:10px;background:#fdebed;border:1px solid #f3c2c8;color:#b3261e;font-size:13px;font-weight:600;line-height:1.55;word-break:break-word}
.api-status{text-align:center;font-size:11px;font-weight:700;color:var(--muted);margin:-18px 0 18px}
.report-note{font-size:12px;color:var(--muted);line-height:1.6}
@media(max-width:800px){.report-grid{grid-template-columns:1fr}.member-actions{flex-direction:column}}

.school-logo,.brand-mark{display:flex;align-items:center;justify-content:center;overflow:hidden}
.school-logo img{width:100%;height:100%;object-fit:contain}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.header-school-logo{width:34px;height:40px;display:flex;align-items:center;justify-content:center;margin-right:6px}
.header-school-logo img{width:100%;height:100%;object-fit:contain}
.sync-btn{border:1px solid var(--border);background:#fff;color:var(--blue);border-radius:9px;padding:9px 13px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.sync-btn:hover{background:#f4f8ff}
.sync-btn.loading{opacity:.65;pointer-events:none}
.sync-status{font-size:11px;color:var(--muted);margin-left:8px}
.page-top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.search-results{position:relative;z-index:20;margin-top:5px;display:flex;flex-direction:column;gap:4px;max-height:230px;overflow:auto}.search-result-item{width:100%;text-align:left;border:1px solid var(--border);background:#fff;border-radius:9px;padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:2px}.search-result-item:hover{background:#f4f8ff}.search-result-item span{font-size:12px;color:var(--muted)}.search-empty,.selected-result{padding:9px 11px;border-radius:9px;background:#f7f9fc;font-size:12px;color:var(--muted)}.selected-result{color:#18864b;font-weight:700}.loan-choice{width:100%;display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;border:1px solid var(--border);background:#fff;border-radius:10px;padding:12px 14px;margin:7px 0;cursor:pointer}.loan-choice:hover{background:#f4f8ff;border-color:#9bb8dc}.loan-choice div{display:flex;flex-direction:column;gap:3px}.loan-choice span{font-size:12px;color:var(--muted);font-weight:400}.loan-choice strong{white-space:nowrap;color:var(--blue)}
</style>
</head>

<script>
function resolveApiUrl(){
  if(window.PERPUS_CONFIG && window.PERPUS_CONFIG.apiUrl) return String(window.PERPUS_CONFIG.apiUrl).trim();
  // Dihosting langsung oleh Apps Script (HtmlService) -> API berada di URL yang sama.
  // Catatan: halaman app berjalan di dalam iframe *.googleusercontent.com dengan
  // prefiks acak (mis. "n-xxxx-script.googleusercontent.com"), jadi pencocokan
  // host memakai includes() agar tidak hanya cocok saat host diawali persis.
  const host=location.host||"";
  if(host.indexOf("script.google")>-1 || host.indexOf("script.googleusercontent.com")>-1){
    return location.origin + location.pathname.replace(/\/config\.js$/,"");
  }
  return "";
}
const API_URL = resolveApiUrl();
// Jika halaman ini disajikan langsung oleh Apps Script (HtmlService), panggilan
// server memakai google.script.run: tidak bergantung URL API, bebas CORS, dan
// bekerja walau halaman berjalan di dalam iframe sandbox Google.
const GAS_HOSTED = !!(window.google && window.google.script && window.google.script.run);

const TOKEN_STORAGE_KEY="PERPUS_SESSION_TOKEN";
// Token disimpan di memori halaman (utama) + sessionStorage (fallback). Di mode
// di-host GAS, sandbox iframe dapat membatasi akses sessionStorage sebelum ada
// interaksi pengguna, jadi variabel memori dijadikan sumber utama.
let currentToken="";
function getSessionToken(){
  if(currentToken) return currentToken;
  try{currentToken=sessionStorage.getItem(TOKEN_STORAGE_KEY)||"";}catch(e){}
  return currentToken;
}
function setSessionToken(token){
  currentToken=String(token||"");
  try{currentToken?sessionStorage.setItem(TOKEN_STORAGE_KEY,currentToken):sessionStorage.removeItem(TOKEN_STORAGE_KEY);}catch(e){}
}
function clearSessionToken(){
  currentToken="";
  try{sessionStorage.removeItem(TOKEN_STORAGE_KEY);}catch(e){}
}

function forceLogout(message){
  currentUser=null;
  serverDataLoaded=false;
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");
  document.getElementById("loginForm").reset();
  if(message) toast(message);
}

let apiOnline = false;

async function apiRequest(action, params={}){
  try{
    const token=getSessionToken();
    const payload={action,...params,...(token?{token}:{})};
    let data;
    if(GAS_HOSTED){
      // Mode di-host Apps Script: panggil fungsi server via google.script.run.
      data=await new Promise((resolve,reject)=>{
        window.google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(err=>reject(err||new Error("Panggilan server gagal.")))
          .apiServerCall(payload);
      });
    }else{
      // Mode hosting eksternal: fetch ke URL API (dari config.js / URL /exec).
      if(!API_URL)return {success:false,message:"Konfigurasi server belum diatur. Isi apiUrl di config.js."};
      const hasFilePayload=!!(payload.coverBase64||payload.base64);
      let response;
      if(hasFilePayload){
        response=await fetch(API_URL,{
          method:"POST",
          headers:{"Content-Type":"text/plain;charset=utf-8"},
          body:JSON.stringify(payload),
          cache:"no-store"
        });
      }else{
        const query=new URLSearchParams(payload);
        response=await fetch(API_URL+"?"+query.toString(),{
          method:"GET",
          cache:"no-store"
        });
      }
      data=await response.json();
    }
    if(!data||typeof data!=="object")data={success:false,message:"Respons server tidak dikenali."};
    apiOnline=!!data.success;
    if(data.success===false && data.code==="AUTH"){
      clearSessionToken();
      if(currentUser) forceLogout("Sesi Anda telah berakhir. Silakan login kembali.");
    }
    return data;
  }catch(error){
    apiOnline=false;
    const reason=(error&&error.message)?error.message:"error";
    return {success:false,message:"Tidak dapat terhubung ke server perpustakaan. ("+reason+")"};
  }
}

}

    currentUser.myLoans=myData.loans||[];

async function refreshServerData(force=false){
 const now=Date.now();
 if(!force && serverDataLoaded && (now-lastServerSync)<CLIENT_CACHE_MS){
   return {success:true,cached:true,message:"Data menggunakan cache sementara."};
 }
 const result=await apiRequest("getAll");
 if(result.success){
   window.serverBooks=result.books||[];
   applyServerMembers(result.members||[]);
   applyServerStats(result.stats||{});
   reportSettings=result.settings||reportSettings;
   reportCache={};

   // getAll sudah mengirim transaksi sekaligus, jadi tidak perlu request getLoans kedua.
   serverLoans=Array.isArray(result.loans)?result.loans:[];
   window.serverLoans=serverLoans;

   const mapped=(window.serverBooks||[]).map(b=>({
     id:String(b["ID Buku"]||""),
     title:b["Judul"]||"",
     author:b["Penulis"]||"",
     publisher:b["Penerbit"]||"",
     year:b["Tahun Terbit"]||"",
     isbn:b["ISBN"]||"",
     cat:(b["Kategori Utama"]||"")+((b["Subkategori"]&&b["Subkategori"]!=="-")?" - "+b["Subkategori"]:""),
     rack:b["Rak"]||"",
     stock:Number(b["Stok"]||0),
     available:Number(b["Tersedia"]||0),
     synopsis:b["Sinopsis"]||"",
     cover:b["Cover"]||"",
     status:b["Status"]||"Aktif"
   }));
   books.splice(0,books.length,...mapped);
   serverDataLoaded=true;
   lastServerSync=Date.now();
 }
 return result;
}
async function refreshTransactionData(force=false){
 if(!force && serverDataLoaded && Array.isArray(serverLoans)) return {success:true,cached:true};
 return await refreshServerData(force);
}

}

async function prepareBrandImage(file,maxW,maxH,quality){
  return await new Promise((resolve,reject)=>{
    if(!file)return reject(new Error("File belum dipilih."));
    if(!/^image\/(jpeg|png|webp)$/.test(file.type))return reject(new Error("File harus JPG, PNG atau WebP."));
    if(file.size>8*1024*1024)return reject(new Error("Ukuran file maksimal 8 MB."));
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("File gagal dibaca."));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("Gambar tidak valid."));
      img.onload=()=>{
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        const ratio=Math.min(1,maxW/w,maxH/h);
        w=Math.max(1,Math.round(w*ratio)); h=Math.max(1,Math.round(h*ratio));
        const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);
        const mime="image/jpeg";
        const dataUrl=canvas.toDataURL(mime,quality);
        resolve({base64:dataUrl.split(",")[1],mime,name:(file.name||"gambar").replace(/\.[^.]+$/,"")+".jpg"});
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function uploadSchoolAssetFromUI(kind){
  const input=document.getElementById(kind==="logo"?"schoolLogoFile":"schoolBgFile");
  const file=input?.files?.[0];
  if(!file){toast("Pilih file terlebih dahulu.");return;}
  try{
    const p=kind==="logo"
      ?await prepareBrandImage(file,700,700,.86)
      :await prepareBrandImage(file,1600,1000,.82);
    const assetType=kind==="logo"?"Logo Sekolah":"Foto Background";
    const r=await apiRequest("uploadSchoolAsset",{assetType,base64:p.base64,mime:p.mime,name:p.name});
    if(!r.success){toast(r.message||"Upload gagal.");return;}
    reportSettings=Object.assign({},reportSettings||{});
    if(r.url) reportSettings[assetType]=r.url;
    applySchoolBranding();
    await refreshServerData(true);
    showPage("admin");
    toast(assetType+" berhasil disimpan ke Google Drive dan diterapkan.");
  }catch(err){toast(err.message||"Upload gagal.");}
}

function coverDisplayUrl(url){
 const s=String(url||"").trim();
 if(!s) return "";
 const id=extractDriveIdFromUrl(s);
 if(id) return "https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w800";
 return s;
}
function extractDriveIdFromUrl(url){
 const s=String(url||"");
 let m=s.match(/[?&]id=([a-zA-Z0-9_-]+)/);
 if(m)return m[1];
 m=s.match(/\/d\/([a-zA-Z0-9_-]+)/);
 if(m)return m[1];
 m=s.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
 return m?m[1]:"";
}

async function prepareCoverImage(file){
  return await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("File gagal dibaca"));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("Gambar tidak valid"));
      img.onload=()=>{
        const max=800;
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(w>max||h>max){
          const ratio=Math.min(max/w,max/h);
          w=Math.round(w*ratio); h=Math.round(h*ratio);
        }
        const canvas=document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        const mime=file.type==="image/png"?"image/png":"image/jpeg";
        const dataUrl=canvas.toDataURL(mime,0.72);
        resolve({
          base64:dataUrl.split(",")[1],
          mime:mime,
          name:(file.name||"cover").replace(/\\.[^.]+$/,"")+(mime==="image/png"?".png":".jpg")
        });
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function openBookForm(id=null){
 const b=id?books.find(x=>x.id===id):null;
 const title=b?"Edit Data Buku":"Tambah Buku";
 document.getElementById("modal").className="modal large";
 document.getElementById("modal").innerHTML=`
   <h2>${title}</h2>
   <p style="color:var(--muted);font-size:13px">${b?"Perbarui data buku yang sudah tersimpan.":"Masukkan data buku baru ke dalam koleksi."}</p>
   <form id="bookForm">
    <div class="form-grid">
      <div class="field"><label>ISBN</label><input name="isbn" required value="${b?.isbn||""}" placeholder="978-..."></div>
      <div class="field"><label>Judul Buku</label><input name="title" required value="${b?.title||""}" placeholder="Judul buku"></div>
      <div class="field"><label>Penulis</label><input name="author" required value="${b?.author||""}" placeholder="Nama penulis"></div>
      <div class="field"><label>Penerbit</label><input name="publisher" value="${b?.publisher||""}" placeholder="Nama penerbit"></div>
      <div class="field"><label>Tahun Terbit</label><input name="year" type="number" value="${b?.year||new Date().getFullYear()}"></div>
      <div class="field"><label>Rak</label><input name="rack" value="${b?.rack||""}" placeholder="Contoh: A-12"></div>
      <div class="field"><label>Kategori Buku</label>
        <select name="cat" required onchange="toggleSubCategory(this)">
          ${categoryOptions(b?.cat||"")}
        </select>
        <div class="category-note">Buku Teks memiliki kelompok Mapel Umum dan Mapel Produktif.</div>
      </div>
      <div class="field"><label>Stok</label><input name="stock" type="number" min="0" value="${b?.stock??1}" required></div>
      <div class="field">
        <label>Cover Buku</label>
        <input id="bookCoverFile" name="coverFile" type="file" accept="image/jpeg,image/png,image/webp,image/jpg">
        <div id="coverPreview" style="margin-top:8px">
          ${b?.cover?`<img src="${b.cover}" alt="Cover buku" style="width:90px;height:120px;object-fit:cover;border:1px solid #dbe3ef;border-radius:8px">`:`<span style="font-size:12px;color:var(--muted)">Belum ada cover.</span>`}
        </div>
        <div class="category-note">Format JPG, PNG atau WebP. Cover akan disimpan otomatis ke Google Drive.</div>
      </div>
      <div class="field full"><label>Sinopsis</label><textarea name="synopsis" placeholder="Deskripsi singkat buku">${b?.synopsis||""}</textarea></div>
    </div>
    <div class="modal-actions">
      <button type="button" class="secondary" onclick="closeModal()">Batal</button>
      <button type="submit" class="action">💾 Simpan</button>
    </div>
   </form>`;
 document.getElementById("modalWrap").classList.remove("hidden");
  document.getElementById("bookCoverFile")?.addEventListener("change",function(){
    const file=this.files?.[0], preview=document.getElementById("coverPreview");
    if(!file||!preview)return;
    const url=URL.createObjectURL(file);
    preview.innerHTML=`<img src="${url}" alt="Preview cover" style="width:90px;height:120px;object-fit:cover;border:1px solid #dbe3ef;border-radius:8px">`;
  });
 document.getElementById("bookForm").onsubmit=async e=>{
   e.preventDefault();
   const fd=new FormData(e.target);
   const data=Object.fromEntries(fd.entries());
   data.year=Number(data.year)||new Date().getFullYear();
   data.stock=Math.max(0,Number(data.stock)||0);

   const coverFile=document.getElementById("bookCoverFile")?.files?.[0]||null;
   let coverBase64="", coverMime="", coverName="";
   if(coverFile){
     if(!/^image\/(jpeg|png|webp)$/.test(coverFile.type)){
       toast("Cover harus berupa JPG, PNG atau WebP.");
       return;
     }
     if(coverFile.size>5*1024*1024){
       toast("Ukuran cover maksimal 5 MB.");
       return;
     }
     try{
       const processed=await prepareCoverImage(coverFile);
       coverBase64=processed.base64;
       coverMime=processed.mime;
       coverName=processed.name;
     }catch(err){
       toast("Cover gagal diproses.");
       return;
     }
   }

   const old=id?books.find(x=>String(x.id)===String(id)):null;
   const payload={
     idBuku: old?.id || "",
     isbn:data.isbn,
     judul:data.title,
     penulis:data.author,
     penerbit:data.publisher,
     tahunTerbit:data.year,
     kategoriUtama:data.cat.includes(" - ")?data.cat.split(" - ")[0]:data.cat,
     subkategori:data.cat.includes(" - ")?data.cat.split(" - ").slice(1).join(" - "):"-",
     rak:data.rack,
     stok:data.stock,
     tersedia: old ? Math.max(0, Math.min(data.stock, Number(old.available||0))) : data.stock,
     sinopsis:data.synopsis,
     cover:old?.cover||"",
     coverBase64:coverBase64,
     coverMime:coverMime,
     coverName:coverName,
     status:old?.status||"Aktif"
   };

   const saveBtn=e.target.querySelector('button[type="submit"]');
   if(saveBtn){saveBtn.disabled=true;saveBtn.textContent="Menyimpan...";}
   // Simpan data buku terlebih dahulu. Cover diunggah terpisah agar file besar
   // tidak membuat penyimpanan data buku gagal.
   let result=await apiRequest("saveBook",payload);
   if(!result.success){
     toast(result.message||"Data buku gagal disimpan.");
     if(saveBtn){saveBtn.disabled=false;saveBtn.textContent="💾 Simpan";}
     return;
   }

   if(coverBase64){
     saveBtn.textContent="Mengunggah cover...";
     const coverResult=await apiRequest("uploadBookCover",{
       idBuku:result.idBuku||payload.idBuku,
       coverBase64:coverBase64,
       coverMime:coverMime,
       coverName:coverName,
       oldCover:old?.cover||""
     });
     if(!coverResult.success){
       closeModal();
       await syncLibraryData("books");
       toast("Buku berhasil disimpan, tetapi Cover gagal diunggah: "+(coverResult.message||"error"));
       if(saveBtn){saveBtn.disabled=false;saveBtn.textContent="💾 Simpan";}
       return;
     }

     // Simpan URL cover ke baris buku.
     result=await apiRequest("saveBook",{...payload,cover:coverResult.cover,coverBase64:"",coverMime:"",coverName:""});
     if(!result.success){
       closeModal();
       await syncLibraryData("books");
       toast("Cover berhasil diunggah, tetapi URL cover belum tersimpan di data buku.");
       if(saveBtn){saveBtn.disabled=false;saveBtn.textContent="💾 Simpan";}
       return;
     }
   }

   closeModal();
   await syncLibraryData("books");
   toast(id?"Data buku berhasil diperbarui di database.":"Buku berhasil ditambahkan ke database.");
   if(saveBtn){saveBtn.disabled=false;saveBtn.textContent="💾 Simpan";}
 };
}

}

async function saveMember(editId){
 const id=document.getElementById("mId").value.trim(),name=document.getElementById("mName").value.trim(),nis=document.getElementById("mNis").value.trim();
 if(!id||!name||!nis){toast("ID, nama, dan NIS/NIP wajib diisi.");return}
 const obj={id,name,nis,kelas:document.getElementById("mKelas").value.trim(),jurusan:document.getElementById("mJurusan").value.trim(),jenis:document.getElementById("mJenis").value,status:"Aktif",loans:[],returned:[],outstanding:"Tidak ada tanggungan"};
 if(editId){const i=membersData.findIndex(x=>x.id===editId);if(i>-1)obj.status=membersData[i].status;}
 else if(membersData.some(x=>x.id===id)){toast("ID Anggota sudah digunakan.");return}
 const r=await apiRequest("saveMember",{idAnggota:id,nisNip:nis,nama:name,kelas:obj.kelas,jurusan:obj.jurusan,jenisAnggota:obj.jenis,status:obj.status});
 if(!r.success){toast(r.message||"Anggota gagal disimpan ke database.");return;}
 if(editId){const i=membersData.findIndex(x=>x.id===editId);if(i>-1){obj.loans=membersData[i].loans;obj.returned=membersData[i].returned;obj.outstanding=membersData[i].outstanding;membersData[i]=obj;}}
 else membersData.push(obj);
 closeModal();toast(editId?"Data anggota berhasil diubah.":"Anggota baru berhasil ditambahkan.");showPage("members");
}

async function setMemberStatus(id,status){
 const m=membersData.find(x=>x.id===id); if(!m)return;
 const r=await apiRequest("setMemberStatus",{idAnggota:id,status});
 if(!r.success){toast(r.message||"Status anggota gagal diperbarui.");return;}
 m.status=status; toast(`${m.name} sekarang berstatus ${status}.`); showPage("members");
}
async function deleteMember(id){
 const m=membersData.find(x=>x.id===id); if(!m)return;
 if(!confirm(`Hapus anggota ${m.name}? Gunakan hanya untuk siswa yang sudah lulus/keluar.`))return;
 const r=await apiRequest("deleteMember",{idAnggota:id});
 if(!r.success){toast(r.message||"Anggota gagal dinonaktifkan.");return;}
 membersData=membersData.filter(x=>x.id!==id);toast("Anggota berhasil ditandai Lulus/keluar.");showPage("members");
}

function renderReturnLoans(memberId){const el=document.getElementById("returnLoanResults");if(!el)return;const active=serverLoans.filter(r=>String(r["ID Anggota"])===String(memberId)&&!String(r["Tanggal Pengembalian"]||"").trim()&&String(r.Status||"").toLowerCase()!=="dikembalikan");if(!active.length){el.innerHTML='<div class="form-info">Siswa ini tidak memiliki buku yang sedang dipinjam.</div>';return}el.innerHTML=`<div style="font-weight:700;margin-bottom:8px">Pilih buku yang dikembalikan:</div>`+active.map(r=>{const b=books.find(x=>String(x.id)===String(r["ID Buku"]));return `<button type="button" class="loan-choice" onclick="processReturn('${escapeJs(r["ID Peminjaman"])}')"><div><b>${escapeHtml(b?.title||r["ID Buku"])}</b><span>Pinjam: ${escapeHtml(formatDisplayDate(r["Tanggal Peminjaman"]))} • Jatuh tempo: ${escapeHtml(formatDisplayDate(r["Rencana Pengembalian"]))}</span></div><strong>↩ Kembalikan</strong></button>`;}).join("");}
async function processReturn(idPeminjaman){
  const fresh=await refreshTransactionData();
  const rows=fresh.success?serverLoans:[];
  const loan=rows.find(r=>String(r["ID Peminjaman"])===String(idPeminjaman));
  if(!loan){toast("Data peminjaman sudah berubah. Silakan sinkronkan lagi.");return;}
  const m=membersData.find(x=>String(x.id)===String(loan["ID Anggota"]));
  const b=books.find(x=>String(x.id)===String(loan["ID Buku"]));
  if(!confirm(`Terima pengembalian buku\n\n${b?.title||loan["ID Buku"]}\noleh ${m?.name||loan["ID Anggota"]}?`))return;
  const result=await apiRequest("return",{
    idPeminjaman:loan["ID Peminjaman"],
    idAnggota:loan["ID Anggota"],
    idBuku:loan["ID Buku"],
    tanggalPengembalian:new Date().toISOString().slice(0,10)
  });
  if(!result.success){toast(result.message||"Pengembalian gagal disimpan.");return;}
  await syncLibraryData("return");
  toast(`Pengembalian berhasil dicatat. Status: ${result.status||"Dikembalikan"}.`);
}
function escapeHtml(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function escapeJs(v){return String(v==null?"":v).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g," ");}
function formatDisplayDate(v){const s=String(v==null?"":v).trim();if(!s)return "-";const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?`${m[3]}/${m[2]}/${m[1]}`:s;}
function transactionRows(mode){
  let rows=Array.isArray(serverLoans)?serverLoans:[];
  if(mode==="active"){
    rows=rows.filter(r=>!String(r["Tanggal Pengembalian"]||"").trim()&&String(r.Status||"").toLowerCase()!=="dikembalikan");
  }else if(mode==="returned"){
    rows=rows.filter(r=>String(r["Tanggal Pengembalian"]||"").trim());
  }
  rows=rows.slice().reverse().slice(0,100);
  if(!rows.length)return '<tr><td colspan="7" style="text-align:center;color:var(--muted)">Belum ada transaksi.</td></tr>';
  return rows.map(r=>{
    const m=membersData.find(x=>String(x.id)===String(r["ID Anggota"]));
    const b=books.find(x=>String(x.id)===String(r["ID Buku"]));
    const st=r.Status||"";
    const cls=String(st).toLowerCase()==="terlambat"?"late":(String(st).toLowerCase()==="dipinjam"?"available":"soon");
    return `<tr>
      <td>${escapeHtml(r["ID Peminjaman"]||"")}</td>
      <td><b>${escapeHtml(m?.name||r["ID Anggota"]||"")}</b><br><small>${escapeHtml(m?.nis||"")}</small></td>
      <td>${escapeHtml(b?.title||r["ID Buku"]||"")}</td>
      <td>${escapeHtml(formatDisplayDate(r["Tanggal Peminjaman"]))}</td>
      <td>${escapeHtml(formatDisplayDate(r["Rencana Pengembalian"]))}</td>
      <td>${escapeHtml(formatDisplayDate(r["Tanggal Pengembalian"]||""))}</td>
      <td><span class="badge ${cls}">${escapeHtml(st)}</span></td>
    </tr>`;
  }).join("");
}

async function fetchMemberReport(id){ const key=id+"-"+new Date().getFullYear(); if(reportCache[key])return reportCache[key]; const r=await apiRequest("memberReport",{idAnggota:id,tahun:new Date().getFullYear()}); if(r.success){reportCache[key]=r;if(r.settings)reportSettings=r.settings;return r;} toast(r.message||"Laporan anggota tidak dapat diambil dari database."); return null; }
async function downloadAnnualReport(){ const id=document.getElementById("annualMember")?.value;if(!id)return toast("Pilih anggota terlebih dahulu.");const r=await fetchMemberReport(id);if(!r)return;const m=membersData.find(x=>x.id===id)||mapServerMember(r.member||{});downloadText(`Laporan_Akhir_Tahun_${m.nis||id}_${(m.name||"Anggota").replace(/\s+/g,"_")}.html`,annualReportHTML(m,r),"text/html");toast("Laporan anggota berhasil diunduh dari database."); }
async function printAnnualReport(){ const id=document.getElementById("annualMember")?.value;if(!id)return toast("Pilih anggota terlebih dahulu.");const r=await fetchMemberReport(id);if(!r)return;const m=membersData.find(x=>x.id===id)||mapServerMember(r.member||{});const w=window.open("","_blank");w.document.write(annualReportHTML(m,r));w.document.close();w.focus();setTimeout(()=>w.print(),400); }
function generalReportHTML(report){
 const data=report||{};
 const rawStats=data.stats||libraryStats||{};
 const stats={
   totalAnggota:data.totalAnggota??rawStats.totalAnggota??0,
   anggotaAktif:data.anggotaAktif??rawStats.anggotaAktif??0,
   peminjamanBulanIni:data.peminjamanBulanIni??rawStats.peminjamanBulanIni??0,
   pengembalianBulanIni:data.pengembalianBulanIni??rawStats.pengembalianBulanIni??0,
   sedangDipinjam:data.sedangDipinjam??rawStats.sedangDipinjam??0,
   terlambat:data.terlambat??rawStats.terlambat??0
 };
 const metrics=data.metrics||{
   totalKunjungan:data.totalKunjungan??0,
   penggunaBerkunjung:data.penggunaBerkunjung??0,
   penggunaMeminjam:data.penggunaMeminjam??0,
   prosentaseKunjungan:data.prosentaseKunjungan??0,
   prosentasePeminjam:data.prosentasePeminjaman??0,
   prosentasePengembalianTepatWaktu:data.prosentasePengembalianTepatWaktu??0
 };
 const settings=data.settings||reportSettings||{};
 const tahun=settings["Tahun Pelajaran"]||"2026/2027";
 const kepala=String(settings["Nama Kepala Sekolah"]||"").trim();
 const nipKepala=String(settings["NIP Kepala Sekolah"]||"").trim();
 const pustakawan=String(settings["Nama Pustakawan"]||"").trim();
 const nipPustakawan=String(settings["NIP Pustakawan"]||"").trim();
 const pct=v=>Number(v||0).toLocaleString("id-ID",{maximumFractionDigits:2})+"%";
 return `<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><title>Laporan Umum Perpustakaan</title>
 <style>body{font-family:Arial;margin:40px;color:#111}h1,h2{text-align:center}table{width:100%;border-collapse:collapse;margin-top:25px}th,td{border:1px solid #555;padding:10px}th{background:#eee}.sig{margin-top:70px;display:flex;justify-content:space-between;text-align:center}.sig>div{width:45%}.note{font-size:12px;color:#555}</style></head><body>
 <h2>${escapeReport(settings["Nama Sekolah"]||"SMKN JATENG DI SEMARANG")}</h2>
 <h1>LAPORAN UMUM PENGGUNA PERPUSTAKAAN</h1>
 <p>Periode: Tahun Pelajaran ${escapeReport(tahun)}</p>
 <table><tr><th>Indikator</th><th>Jumlah</th><th>Prosentase</th></tr>
 <tr><td>Total Anggota</td><td>${fmtNum(stats.totalAnggota)}</td><td>100%</td></tr>
 <tr><td>Pengguna yang Berkunjung</td><td>${fmtNum(metrics.penggunaBerkunjung)}</td><td>${pct(metrics.prosentaseKunjungan)}</td></tr>
 <tr><td>Pengguna yang Meminjam Buku</td><td>${fmtNum(metrics.penggunaMeminjam)}</td><td>${pct(metrics.prosentasePeminjam)}</td></tr>
 <tr><td>Total Kunjungan</td><td>${fmtNum(metrics.totalKunjungan)}</td><td>-</td></tr>
 <tr><td>Peminjaman Bulan Ini</td><td>${fmtNum(stats.peminjamanBulanIni)}</td><td>-</td></tr>
 <tr><td>Pengembalian Bulan Ini</td><td>${fmtNum(stats.pengembalianBulanIni)}</td><td>-</td></tr>
 <tr><td>Sedang Dipinjam</td><td>${fmtNum(stats.sedangDipinjam)}</td><td>-</td></tr>
 <tr><td>Terlambat</td><td>${fmtNum(stats.terlambat)}</td><td>-</td></tr>
 <tr><td>Pengembalian Tepat Waktu</td><td>-</td><td>${pct(metrics.prosentasePengembalianTepatWaktu)}</td></tr></table>
 <p class="note">Laporan ini dihitung dari database perpustakaan.</p>
 <div class="sig"><div>Mengetahui,<br>Kepala Sekolah<br><br><br><b>${escapeReport(kepala||"__________________")}</b>${nipKepala?`<br>NIP. ${escapeReport(nipKepala)}`:""}</div>
 <div>Semarang, ${new Date().toLocaleDateString("id-ID")}<br>Pustakawan<br><br><br><b>${escapeReport(pustakawan||"__________________")}</b>${nipPustakawan?`<br>NIP. ${escapeReport(nipPustakawan)}`:""}</div></div>
 </body></html>`;
}

async function downloadGeneralReport(){ const r=await apiRequest("generalReport");if(!r.success)return toast(r.message||"Laporan umum gagal diambil.");reportSettings=r.settings||reportSettings;downloadText("Laporan_Umum_Pengguna_Perpustakaan.html",generalReportHTML(r),"text/html");toast("Laporan umum berhasil diunduh dari database."); }
async function printGeneralReport(){ const r=await apiRequest("generalReport");if(!r.success)return toast(r.message||"Laporan umum gagal diambil.");reportSettings=r.settings||reportSettings;const w=window.open("","_blank");w.document.write(generalReportHTML(r));w.document.close();w.focus();setTimeout(()=>w.print(),400); }
function downloadText(filename,content,type){const blob=new Blob([content],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}

function bindPage(){
 const s=document.getElementById('annualMember');
 if(s){s.onchange=updateAnnualPreview; updateAnnualPreview();}
 if(['borrow','return','transactions'].includes(currentPageName)){
   loadTransactionPageData();
 }
}
async function loadTransactionPageData(){
 const result=await refreshTransactionData();
 if(!result.success)return;
 const allBody=document.getElementById('borrowTransactionsBody');
 if(allBody) allBody.innerHTML=transactionRows('all');
 const retBody=document.getElementById('returnTransactionsBody');
 if(retBody) retBody.innerHTML=transactionRows('returned');
 const selected=document.getElementById('returnMemberId')?.value;
 if(selected) renderReturnLoans(selected);
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.add("hidden"),2800)}

(async function initServerConnection(){
  // Sebelum login hanya pengaturan (branding) yang dibuka; data perpustakaan dimuat setelah login.
  const s=await apiRequest("settings");
  if(s && s.success && s.settings) reportSettings=s.settings;
  const statusEl=document.getElementById("apiStatus");
  const ok=!!(s && s.success);
  if(statusEl) statusEl.textContent=ok?"● Database terhubung":"● Database belum terhubung";
  if(statusEl) statusEl.style.color=ok?"#18864b":"#c62828";
  applySchoolBranding();
  if(!ok) console.warn("Apps Script belum terhubung:", s && s.message);
})();
</script>
